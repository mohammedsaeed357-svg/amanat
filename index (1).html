<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأمانات">
<meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141917" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>دفتر الأمانات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe4; --card:#fffdf8; --ink:#1d2621; --muted:#6b726c; --line:#e6dfcf;
  --accent:#0f5e4a; --accent-ink:#ffffff; --accent-soft:#dcebe4;
  --out:#a8402b; --out-soft:#f7e4dd; --in:#2f7a3f; --in-soft:#e2efe0;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141917; --card:#1d2421; --ink:#ece8df; --muted:#9aa29c; --line:#2c3531;
    --accent:#2f9c7c; --accent-ink:#06130e; --accent-soft:#1e3a31;
    --out:#e58a73; --out-soft:#3a2520; --in:#7cc78a; --in-soft:#1f3423;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 120px calc(16px + env(safe-area-inset-left,0px))}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 18px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.top-btns{display:flex;gap:8px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:14px}
.iconbtn:active{transform:scale(.97)}

.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-out{background:var(--out);color:#fff}
.btn-in{background:var(--in-soft);color:var(--in)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-block{width:100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.trust-card{display:block;width:100%;text-align:right;padding:16px;margin-bottom:12px;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.trust-card:active{transform:scale(.99)}
.tc-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tc-name{font-weight:700;font-size:17px}
.tc-rem{font-weight:700;font-size:19px;color:var(--accent)}
.tc-sub{color:var(--muted);font-size:13px;margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:20px 18px 18px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:38px;font-weight:700;line-height:1.15;margin:4px 0 14px}
.hero .bar{background:rgba(255,255,255,.22);margin:0 0 14px}
.hero .bar>i{background:#fff}
@media (prefers-color-scheme:dark){.hero .bar>i{background:var(--accent-ink)} .hero .bar{background:rgba(0,0,0,.2)}}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.hero-stats div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
@media (prefers-color-scheme:dark){.hero-stats div{background:rgba(0,0,0,.15)}}
.hero-stats small{display:block;font-size:12px;opacity:.85}
.hero-stats b{font-size:16px}

.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px;font-size:14px;color:var(--muted);font-weight:600}

.tx{padding:14px;margin-bottom:10px}
.tx-head{display:flex;gap:12px;align-items:flex-start}
.tx-ico{flex:0 0 38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.tx-ico.out{background:var(--out-soft);color:var(--out)}
.tx-ico.in{background:var(--in-soft);color:var(--in)}
.tx-main{flex:1;min-width:0}
.tx-title{font-weight:600}
.tx-date{color:var(--muted);font-size:13px}
.tx-note{font-size:14px;margin-top:6px;color:var(--ink);opacity:.85;white-space:pre-wrap;word-break:break-word}
.tx-amt{font-weight:700;font-size:17px;white-space:nowrap}
.tx-amt.out{color:var(--out)} .tx-amt.in{color:var(--in)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{width:64px;height:64px;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative;font-size:12px;color:var(--muted);text-decoration:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tx-actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.link{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 6px}

.bottombar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.bottombar .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:10px}

.empty{text-align:center;padding:40px 18px}
.empty .art{font-size:46px;margin-bottom:8px}
.empty h2{margin:0 0 6px;font-size:19px}
.empty p{margin:0 0 18px;color:var(--muted);font-size:14px}
.notice{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:14px;margin-bottom:12px}
.notice.warn{border-color:var(--out);color:var(--out)}

.modal-bg{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media (min-width:640px){.modal-bg{align-items:center}.sheet{border-radius:22px}}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(30px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.modal-bg,.sheet{animation:none}}
.sheet h3{margin:0 0 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 13px;outline:none}
.input:focus{border-color:var(--accent)}
.input.big{font-size:24px;font-weight:700;text-align:center;direction:ltr}
textarea.input{min-height:70px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.hint{font-size:13px;margin-top:6px;color:var(--muted)}
.hint.bad{color:var(--out);font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;display:block}
.prev{position:relative}
.prev .x{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--out);color:#fff;font-size:13px;line-height:22px;cursor:pointer;padding:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:13px;color:var(--muted);text-align:center;min-height:20px;margin:8px 0 0}
.status.bad{color:var(--out)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:70;animation:fade .2s}
.menu-item{display:flex;width:100%;text-align:right;align-items:center;gap:10px;padding:14px;border:0;background:var(--bg);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:15px}
pre.summary{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:14px;max-height:50vh;overflow:auto;user-select:text}
textarea.backup{width:100%;min-height:140px;font-size:12px;direction:ltr;text-align:left;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
/* ============ local storage on this phone (IndexedDB, fallback memory) ============ */
const Store = (() => {
  let db = null, ok = false;
  const mem = { trusts: new Map(), tx: new Map(), files: new Map() };
  const open = () => new Promise(res => {
    try {
      const rq = indexedDB.open('amanat_local', 1);
      rq.onupgradeneeded = () => { const d = rq.result; ['trusts','tx','files'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); }); };
      rq.onsuccess = () => { db = rq.result; ok = true; res(true); };
      rq.onerror = () => res(false);
      rq.onblocked = () => res(false);
    } catch (e) { res(false); }
  });
  const tx = (name, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(name, mode); const st = t.objectStore(name); let out;
    const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
  });
  return {
    open, get ok() { return ok; },
    all: async n => ok ? (await tx(n, 'readonly', s => s.getAll())) || [] : [...mem[n].values()],
    put: async (n, v) => { if (ok) await tx(n, 'readwrite', s => s.put(v)); else mem[n].set(v.id, v); },
    del: async (n, id) => { if (ok) await tx(n, 'readwrite', s => s.delete(id)); else mem[n].delete(id); },
    get: async (n, id) => ok ? tx(n, 'readonly', s => s.get(id)) : mem[n].get(id),
  };
})();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const $app = document.getElementById('app');
const $modal = document.getElementById('modal');
const S = { ready:false, persistent:null, trusts:[], tx:[], view:'home', cur:null, urls:{} };
const CUR = { ILS:'₪', USD:'$', JOD:'د.أ', EUR:'€' };
const CUR_NAME = { ILS:'شيكل ₪', USD:'دولار $', JOD:'دينار أردني', EUR:'يورو €' };
const WD = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toNum = s => {
  s = String(s || '')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/٫/g, '.').replace(/[,،\s]/g, '');
  const n = parseFloat(s); return isFinite(n) ? n : NaN;
};
const fmtN = n => (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
const money = (n, c) => `<span class="num">${fmtN(n)} ${CUR[c] || ''}</span>`;
const moneyTxt = (n, c) => `${fmtN(n)} ${CUR[c] || ''}`;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayName = iso => { const [y,m,d] = String(iso).split('-').map(Number); const dt = new Date(y, m-1, d); return isNaN(dt) ? '' : WD[dt.getDay()]; };
const dmy = iso => { const [y,m,d] = String(iso).split('-'); return d ? `${d}/${m}/${y}` : ''; };
const recUrl = r => S.urls[r.id] || '';

async function reload() {
  S.trusts = await Store.all('trusts');
  S.tx = await Store.all('tx');
  const need = new Set(); S.tx.forEach(x => (x.receipts || []).forEach(r => need.add(r.id)));
  for (const id of need) if (!S.urls[id]) {
    try { const f = await Store.get('files', id); if (f && f.blob) S.urls[id] = URL.createObjectURL(f.blob); } catch (e) {}
  }
  render();
}

function stats(tid) {
  const list = S.tx.filter(t => t.trustId === tid)
    .sort((a,b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt||0) - (a.createdAt||0));
  let inn = 0, out = 0;
  for (const t of list) { if (t.type === 'deposit') inn += +t.amount || 0; else out += +t.amount || 0; }
  return { list, inn, out, rem: inn - out };
}
const trust = id => S.trusts.find(t => t.id === id);

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}
function errMsg(e) {
  if (e && e.name === 'QuotaExceededError') return 'ذاكرة الجوال امتلأت، احذف إيصالات قديمة';
  return 'ما انحفظ، جرّب كمان مرة';
}

/* ---------- render ---------- */
function render() {
  if (S.view === 'trust' && !trust(S.cur)) S.view = 'home';
  $app.innerHTML = S.view === 'trust' ? renderTrust() : renderHome();
}

function renderHome() {
  let body = '';
  if (!Store.ok && S.ready) body += `<div class="notice warn">الجوال مش سامح يحفظ هون، فالبيانات رح تروح لما تسكّر الصفحة. افتح الرابط من Safari أو Chrome، وتأكد إنك مش بالتصفح الخفي.</div>`;
  if (!S.ready) body += `<div class="notice">جاري التحميل…</div>`;
  else if (!S.trusts.length) {
    body += `<div class="empty card"><div class="art">📒</div><h2>ولا أمانة لسا</h2><p>سجّل المبلغ اللي استلمته، وبعدين كل تحويل بتعمله بتاريخه وإيصاله، والباقي بينحسب لحاله.</p>
      <button class="btn btn-primary" data-act="newTrust">+ أمانة جديدة</button></div>`;
  } else {
    const sorted = [...S.trusts].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    body += sorted.map(t => {
      const s = stats(t.id); const pct = s.inn > 0 ? Math.max(0, Math.min(100, s.rem / s.inn * 100)) : 0;
      return `<button class="trust-card" data-act="open" data-id="${esc(t.id)}">
        <div class="tc-row"><span class="tc-name">${esc(t.name)}</span><span class="tc-rem">${money(s.rem, t.currency)}</span></div>
        <div class="tc-row tc-sub"><span>${s.list.filter(x=>x.type!=='deposit').length} تحويل</span><span>ضايل من ${money(s.inn, t.currency)}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div></button>`;
    }).join('');
  }
  return `<div class="wrap">
    <div class="top"><div class="brand"><h1>دفتر الأمانات</h1><p>محفوظ على جوالك</p></div>
    <div class="top-btns">
      <button class="iconbtn" data-act="backup" aria-label="نسخة احتياطية">💾</button>
      ${S.trusts.length ? `<button class="iconbtn" data-act="newTrust">+ جديدة</button>` : ''}
    </div></div>
    ${body}</div>`;
}

function renderTrust() {
  const t = trust(S.cur); if (!t) return '';
  const s = stats(t.id); const c = t.currency;
  const pct = s.inn > 0 ? Math.max(0, Math.min(100, s.rem / s.inn * 100)) : 0;
  const rows = s.list.map(x => {
    const out = x.type !== 'deposit';
    const title = out ? (x.toSelf ? `تحويل لـ ${esc(t.name)}` : `تحويل لـ ${esc(x.recipient || '—')}`) : 'إضافة للأمانة';
    const thumbs = (x.receipts || []).map(r => {
      const u = recUrl(r);
      if (!u) return `<div class="thumb">—</div>`;
      return (r.type || '').startsWith('image/')
        ? `<button class="thumb" data-act="view" data-src="${esc(u)}"><img src="${esc(u)}" alt="إيصال" loading="lazy"></button>`
        : `<a class="thumb" href="${esc(u)}" target="_blank" rel="noopener">📄 PDF</a>`;
    }).join('');
    return `<div class="card tx">
      <div class="tx-head">
        <div class="tx-ico ${out ? 'out' : 'in'}">${out ? '↑' : '↓'}</div>
        <div class="tx-main"><div class="tx-title">${title}</div>
          <div class="tx-date">${dayName(x.date)} · <span class="num">${dmy(x.date)}</span></div></div>
        <div class="tx-amt ${out ? 'out' : 'in'}">${out ? '−' : '+'}${money(x.amount, c)}</div>
      </div>
      ${x.note ? `<div class="tx-note">${esc(x.note)}</div>` : ''}
      ${thumbs ? `<div class="thumbs">${thumbs}</div>` : ''}
      <div class="tx-actions"><button class="link" data-act="editTx" data-id="${esc(x.id)}">تعديل</button><button class="link" data-act="delTx" data-id="${esc(x.id)}">حذف</button></div>
    </div>`;
  }).join('');
  return `<div class="wrap">
    <div class="top">
      <button class="iconbtn" data-act="home">→ الرجوع</button>
      <button class="iconbtn" data-act="trustMenu" aria-label="خيارات">⋯</button>
    </div>
    <div class="hero">
      <div class="lbl">ضايل لـ ${esc(t.name)}</div>
      <div class="big">${money(s.rem, c)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="hero-stats">
        <div><small>المبلغ الكلي</small><b>${money(s.inn, c)}</b></div>
        <div><small>انحوّل لحد الآن</small><b>${money(s.out, c)}</b></div>
      </div>
    </div>
    <div class="section-title"><span>الحركات (${s.list.length})</span></div>
    ${rows || `<div class="notice">لسا ما في حركات.</div>`}
    </div>
    <div class="bottombar"><div class="inner">
      <button class="btn btn-out" data-act="newTx" data-type="withdraw">↑ تسجيل تحويل</button>
      <button class="btn btn-in" data-act="newTx" data-type="deposit">+ إضافة مبلغ</button>
    </div></div>`;
}

/* ---------- modal helpers ---------- */
let F = null;
function openModal(html) { $modal.innerHTML = `<div class="modal-bg" data-bg="1"><div class="sheet">${html}</div></div>`; }
function closeModal() { if (F && F.urls) F.urls.forEach(u => URL.revokeObjectURL(u)); F = null; $modal.innerHTML = ''; }
$modal.addEventListener('click', e => { if (e.target.dataset && e.target.dataset.bg && !(F && F.busy)) closeModal(); });

function confirmBox(title, text, okLabel, onOk) {
  openModal(`<h3>${title}</h3><p style="margin:0 0 18px;color:var(--muted)">${text}</p>
    <div class="row2"><button class="btn btn-ghost" data-act="close">إلغاء</button><button class="btn btn-out" id="okBtn">${okLabel}</button></div>
    <div class="status" id="st"></div>`);
  document.getElementById('okBtn').onclick = async ev => {
    ev.target.disabled = true;
    try { await onOk(); closeModal(); await reload(); } catch (e) { const st = document.getElementById('st'); st.className = 'status bad'; st.textContent = errMsg(e); ev.target.disabled = false; }
  };
}

/* ---------- trust form ---------- */
function trustForm(existing) {
  F = { kind: 'trust', existing };
  const t = existing || {};
  openModal(`<h3>${existing ? 'تعديل الأمانة' : 'أمانة جديدة'}<button class="link" data-act="close">✕</button></h3>
    <form id="f">
      <div class="field"><label>اسم صاحب الأمانة</label><input class="input" name="name" value="${esc(t.name || '')}" placeholder="مثلاً: أبو محمد" required></div>
      <div class="field"><label>العملة</label><select class="input" name="currency">
        ${Object.keys(CUR).map(k => `<option value="${k}" ${ (t.currency||'ILS')===k ? 'selected':''}>${CUR_NAME[k]}</option>`).join('')}</select></div>
      ${existing ? '' : `<div class="row2">
        <div class="field"><label>المبلغ اللي استلمته</label><input class="input" name="amount" inputmode="decimal" placeholder="0" style="direction:ltr;text-align:center"></div>
        <div class="field"><label>تاريخ الاستلام</label><input class="input" type="date" name="date" value="${today()}"></div></div>`}
      <button class="btn btn-primary btn-block" id="saveBtn">حفظ</button>
      <div class="status" id="st"></div>
    </form>`);
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target); const name = String(fd.get('name')).trim();
    const st = document.getElementById('st'); const btn = document.getElementById('saveBtn');
    if (!name) return;
    const amount = existing ? 0 : toNum(fd.get('amount'));
    if (!existing && fd.get('amount') && (isNaN(amount) || amount < 0)) { st.className='status bad'; st.textContent='المبلغ مش مفهوم'; return; }
    btn.disabled = true; F.busy = true;
    try {
      if (existing) {
        await Store.put('trusts', { ...existing, name, currency: fd.get('currency') });
      } else {
        const id = uid();
        await Store.put('trusts', { id, name, currency: fd.get('currency'), createdAt: Date.now() });
        if (amount > 0) await Store.put('tx', { id: uid(), trustId: id, type: 'deposit', amount, date: fd.get('date') || today(), note: 'المبلغ الأساسي', recipient: '', toSelf: false, receipts: [], createdAt: Date.now() });
        S.view = 'trust'; S.cur = id;
      }
      closeModal(); await reload(); toast('انحفظ ✓');
    } catch (err) { F.busy = false; btn.disabled = false; st.className = 'status bad'; st.textContent = errMsg(err); }
  };
}

/* ---------- transaction form ---------- */
function txForm(type, existing) {
  const t = trust(S.cur); const s = stats(t.id);
  const x = existing || {};
  F = { kind: 'tx', type, existing, toSelf: existing ? !!x.toSelf : true, kept: [...(x.receipts || [])], removed: [], added: [], urls: [], busy: false };
  const out = type !== 'deposit';
  const baseRem = s.rem + (existing ? (out ? +x.amount : -x.amount) : 0);
  openModal(`<h3>${existing ? 'تعديل' : (out ? 'تسجيل تحويل' : 'إضافة مبلغ للأمانة')}<button class="link" data-act="close">✕</button></h3>
    <form id="f">
      <div class="field"><label>المبلغ (${CUR_NAME[t.currency] || ''})</label>
        <input class="input big" name="amount" inputmode="decimal" placeholder="0" value="${existing ? esc(x.amount) : ''}" autocomplete="off">
        <div class="hint" id="remHint"></div></div>
      <div class="field"><label>التاريخ</label><input class="input" type="date" name="date" value="${esc(x.date || today())}"><div class="hint" id="dayHint"></div></div>
      ${out ? `<div class="field"><label>لمين انبعت؟</label>
        <div class="seg"><button type="button" data-self="1" class="${F.toSelf?'on':''}">لـ ${esc(t.name)} نفسه</button><button type="button" data-self="0" class="${F.toSelf?'':'on'}">لشخص ثاني</button></div>
        <input class="input" name="recipient" id="recip" placeholder="اسم الشخص اللي استلم" value="${esc(x.recipient || '')}" style="margin-top:8px;${F.toSelf?'display:none':''}"></div>` : ''}
      <div class="field"><label>ملاحظة (اختياري)</label><textarea class="input" name="note" placeholder="${out ? 'مثلاً: طلب يحوّل لأخوه، بنك فلسطين…' : ''}">${esc(existing ? (x.note||'') : '')}</textarea></div>
      <div class="field"><label>الإيصالات</label>
        <div class="thumbs" id="prevs" style="margin:0 0 10px"></div>
        <label class="drop" for="file">📎 إرفاق صورة أو PDF</label>
        <input type="file" id="file" accept="image/*,application/pdf" multiple style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden">
        <textarea class="input" id="pasteBox" rows="1" placeholder="أو: انسخ صورة الإيصال، واضغط هون مطوّل ← لصق" style="margin-top:8px;min-height:46px;text-align:center;font-size:14px;resize:none"></textarea></div>
      <button class="btn ${out ? 'btn-out' : 'btn-primary'} btn-block" id="saveBtn">حفظ</button>
      <div class="status" id="st"></div>
    </form>`);
  const f = document.getElementById('f');
  const remHint = document.getElementById('remHint'), dayHint = document.getElementById('dayHint');
  const upd = () => {
    const a = toNum(f.amount.value);
    const after = baseRem + (isNaN(a) ? 0 : (out ? -a : a));
    remHint.className = 'hint' + (after < 0 ? ' bad' : '');
    remHint.innerHTML = after < 0 ? `⚠️ أكثر من الباقي بـ ${money(-after, t.currency)}` : `بعدها بضل: ${money(after, t.currency)}`;
    dayHint.textContent = f.date.value ? dayName(f.date.value) : '';
  };
  f.amount.oninput = upd; f.date.oninput = upd; upd();
  f.querySelectorAll('[data-self]').forEach(b => b.onclick = () => {
    F.toSelf = b.dataset.self === '1';
    f.querySelectorAll('[data-self]').forEach(o => o.classList.toggle('on', o === b));
    const r = document.getElementById('recip'); r.style.display = F.toSelf ? 'none' : ''; if (!F.toSelf) r.focus();
  });
  const fileIn = document.getElementById('file');
  fileIn.onchange = () => { for (const file of fileIn.files) F.added.push(file); fileIn.value = ''; drawPrevs(); };
  const pasteBox = document.getElementById('pasteBox');
  pasteBox.addEventListener('paste', ev => {
    const cd = ev.clipboardData; let got = 0;
    if (cd) {
      const files = cd.files && cd.files.length ? [...cd.files] : [...(cd.items || [])].filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean);
      for (const file of files) if ((file.type || '').startsWith('image/') || file.type === 'application/pdf') { F.added.push(file); got++; }
    }
    ev.preventDefault(); pasteBox.value = ''; pasteBox.blur();
    if (got) { drawPrevs(); toast('انلصقت الصورة ✓'); } else toast('ما في صورة منسوخة');
  });
  pasteBox.addEventListener('input', () => { pasteBox.value = ''; });
  drawPrevs();
  if (!existing) setTimeout(() => f.amount.focus(), 250);
  f.onsubmit = e => { e.preventDefault(); saveTx(f, type, existing, t); };
}

function drawPrevs() {
  const box = document.getElementById('prevs'); if (!box) return;
  F.urls.forEach(u => URL.revokeObjectURL(u)); F.urls = [];
  const kept = F.kept.map((r, i) => `<div class="prev"><div class="thumb">${(r.type||'').startsWith('image/') && recUrl(r) ? `<img src="${esc(recUrl(r))}">` : '📄 PDF'}</div><button type="button" class="x" data-rmk="${i}">✕</button></div>`);
  const added = F.added.map((file, i) => {
    let inner = '📄 PDF';
    if (file.type.startsWith('image/')) { const u = URL.createObjectURL(file); F.urls.push(u); inner = `<img src="${u}">`; }
    return `<div class="prev"><div class="thumb">${inner}</div><button type="button" class="x" data-rma="${i}">✕</button></div>`;
  });
  box.innerHTML = kept.concat(added).join('');
  box.querySelectorAll('[data-rmk]').forEach(b => b.onclick = () => { F.removed.push(F.kept.splice(+b.dataset.rmk, 1)[0]); drawPrevs(); });
  box.querySelectorAll('[data-rma]').forEach(b => b.onclick = () => { F.added.splice(+b.dataset.rma, 1); drawPrevs(); });
}

/* shrink big photos so the phone's storage lasts */
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); };
    im.src = u;
  });
}
async function prepFile(file) {
  const type = (file.type || '').toLowerCase();
  if (type === 'application/pdf' || type === 'image/gif') return { blob: file, type };
  if (file.size < 400000 && /^image\/(jpeg|png|webp)$/.test(type)) return { blob: file, type };
  let src = null;
  try { src = await createImageBitmap(file); } catch (e) { try { src = await loadImg(file); } catch (e2) {} }
  if (!src) return { blob: file, type: type || 'application/octet-stream' };
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const sc = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(src, 0, 0, c.width, c.height);
  const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  if (!b || b.size >= file.size) return { blob: file, type };
  return { blob: b, type: 'image/jpeg' };
}

async function saveTx(f, type, existing, t) {
  const st = document.getElementById('st'), btn = document.getElementById('saveBtn');
  const amount = toNum(f.amount.value);
  const bad = m => { st.className = 'status bad'; st.textContent = m; };
  if (isNaN(amount) || amount <= 0) return bad('اكتب المبلغ');
  if (!f.date.value) return bad('اختار التاريخ');
  const out = type !== 'deposit';
  const recipient = out && !F.toSelf ? f.recipient.value.trim() : '';
  if (out && !F.toSelf && !recipient) return bad('اكتب اسم الشخص اللي استلم');
  btn.disabled = true; F.busy = true; st.className = 'status'; st.textContent = 'جاري الحفظ…';
  try {
    const receipts = [...F.kept];
    for (const file of F.added) {
      const p = await prepFile(file);
      const id = uid();
      await Store.put('files', { id, blob: p.blob, type: p.type, name: file.name || '' });
      S.urls[id] = URL.createObjectURL(p.blob);
      receipts.push({ id, type: p.type, name: file.name || '' });
    }
    const body = { id: existing ? existing.id : uid(), trustId: t.id, type: out ? 'withdraw' : 'deposit', amount, date: f.date.value,
      toSelf: out ? F.toSelf : false, recipient, note: f.note.value.trim(), receipts,
      createdAt: existing ? (existing.createdAt || Date.now()) : Date.now(), updatedAt: Date.now() };
    await Store.put('tx', body);
    for (const r of F.removed) { try { await Store.del('files', r.id); } catch (e) {} }
    closeModal(); await reload(); toast('انحفظ ✓');
  } catch (err) { F.busy = false; btn.disabled = false; bad(errMsg(err)); }
}

/* ---------- trust menu / summary ---------- */
function trustMenu() {
  const t = trust(S.cur);
  openModal(`<h3>${esc(t.name)}<button class="link" data-act="close">✕</button></h3>
    <button class="menu-item" data-act="summary">📋 نسخ كشف الحساب (للواتساب)</button>
    <button class="menu-item" data-act="editTrust">✏️ تعديل الاسم أو العملة</button>
    <button class="menu-item" data-act="delTrust" style="color:var(--out)">🗑️ حذف الأمانة كلها</button>`);
}
function summaryText() {
  const t = trust(S.cur), s = stats(t.id), c = t.currency;
  const lines = [`كشف أمانة: ${t.name}`, `المبلغ الكلي: ${moneyTxt(s.inn, c)}`, `انحوّل: ${moneyTxt(s.out, c)}`, `الباقي: ${moneyTxt(s.rem, c)}`, '', 'الحركات:'];
  [...s.list].reverse().forEach(x => {
    const out = x.type !== 'deposit';
    const who = out ? (x.toSelf ? 'إلك' : `لـ ${x.recipient}`) : 'إضافة';
    lines.push(`• ${dayName(x.date)} ${dmy(x.date)}: ${out ? '−' : '+'}${moneyTxt(x.amount, c)} (${who})${x.note ? ' - ' + x.note : ''}`);
  });
  return lines.join('\n');
}
function showSummary() {
  const txt = summaryText();
  openModal(`<h3>كشف الحساب<button class="link" data-act="close">✕</button></h3>
    <pre class="summary">${esc(txt)}</pre>
    <button class="btn btn-primary btn-block" id="copyBtn" style="margin-top:12px">نسخ</button>`);
  document.getElementById('copyBtn').onclick = async ev => {
    try { await navigator.clipboard.writeText(txt); ev.target.textContent = 'انتسخ ✓'; }
    catch (e) { ev.target.textContent = 'ظلّل النص وانسخه يدوي'; }
  };
}

/* ---------- backup (text only, no receipt images) ---------- */
function backupSheet() {
  const data = JSON.stringify({ app: 'amanat', v: 1, at: new Date().toISOString(),
    trusts: S.trusts, tx: S.tx.map(x => ({ ...x, receipts: [] })) });
  openModal(`<h3>نسخة احتياطية<button class="link" data-act="close">✕</button></h3>
    <p style="margin:0 0 10px;color:var(--muted);font-size:14px">البيانات محفوظة على هالجوال بس. انسخ هالنص وابعته لنفسك على الواتساب كل فترة، عشان إذا انمسح المتصفح أو غيّرت الجوال تقدر ترجّعها. (الإيصالات ما بتنحفظ بالنسخة، بس الأرقام والملاحظات.)</p>
    <button class="btn btn-primary btn-block" id="cpB">نسخ النسخة الاحتياطية</button>
    <div style="height:18px"></div>
    <div class="field"><label>ترجيع من نسخة احتياطية</label>
      <textarea class="input backup" id="rIn" placeholder="الصق النص هون"></textarea></div>
    <button class="btn btn-ghost btn-block" id="rBtn">ترجيع البيانات</button>
    <div class="status" id="st"></div>`);
  document.getElementById('cpB').onclick = async ev => {
    try { await navigator.clipboard.writeText(data); ev.target.textContent = 'انتسخت ✓ ابعتها لنفسك'; }
    catch (e) { const ta = document.getElementById('rIn'); ta.value = data; ta.select(); ev.target.textContent = 'ظلّل النص تحت وانسخه'; }
  };
  document.getElementById('rBtn').onclick = async () => {
    const st = document.getElementById('st');
    let d; try { d = JSON.parse(document.getElementById('rIn').value); } catch (e) { st.className='status bad'; st.textContent='النص مش نسخة احتياطية صحيحة'; return; }
    if (!d || d.app !== 'amanat' || !Array.isArray(d.trusts) || !Array.isArray(d.tx)) { st.className='status bad'; st.textContent='النص مش نسخة احتياطية صحيحة'; return; }
    try {
      for (const t of d.trusts) if (t && t.id) await Store.put('trusts', t);
      for (const x of d.tx) if (x && x.id) { const old = S.tx.find(o => o.id === x.id); await Store.put('tx', { ...x, receipts: old ? old.receipts : [] }); }
      closeModal(); await reload(); toast(`رجعت ${d.trusts.length} أمانة ✓`);
    } catch (e) { st.className='status bad'; st.textContent=errMsg(e); }
  };
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'close') return closeModal();
  if (act === 'newTrust') return trustForm();
  if (act === 'backup') return backupSheet();
  if (act === 'open') { S.view = 'trust'; S.cur = id; render(); window.scrollTo(0, 0); return; }
  if (act === 'home') { S.view = 'home'; render(); return; }
  if (act === 'newTx') return txForm(el.dataset.type);
  if (act === 'editTx') { const x = S.tx.find(t => t.id === id); if (x) txForm(x.type === 'deposit' ? 'deposit' : 'withdraw', x); return; }
  if (act === 'delTx') {
    const x = S.tx.find(t => t.id === id); if (!x) return;
    const t = trust(x.trustId);
    return confirmBox('حذف الحركة؟', `${dayName(x.date)} ${dmy(x.date)} — ${moneyTxt(x.amount, t.currency)}. الإيصالات كمان رح تنحذف.`, 'حذف', async () => {
      await Store.del('tx', x.id);
      for (const r of (x.receipts || [])) { try { await Store.del('files', r.id); } catch (e) {} }
      toast('انحذفت');
    });
  }
  if (act === 'trustMenu') return trustMenu();
  if (act === 'summary') return showSummary();
  if (act === 'editTrust') return trustForm(trust(S.cur));
  if (act === 'delTrust') {
    const t = trust(S.cur);
    return confirmBox('حذف الأمانة كلها؟', `رح تنحذف أمانة «${esc(t.name)}» مع كل حركاتها وإيصالاتها، وما في رجعة.`, 'احذف نهائياً', async () => {
      for (const x of S.tx.filter(x => x.trustId === t.id)) {
        await Store.del('tx', x.id);
        for (const r of (x.receipts || [])) { try { await Store.del('files', r.id); } catch (e) {} }
      }
      await Store.del('trusts', t.id);
      S.view = 'home'; toast('انحذفت');
    });
  }
  if (act === 'view') {
    const lb = document.createElement('div'); lb.className = 'lightbox';
    lb.innerHTML = `<img src="${esc(el.dataset.src)}" alt="إيصال"><button class="iconbtn">✕ إغلاق</button>`;
    lb.onclick = () => lb.remove(); document.body.appendChild(lb);
  }
});

/* ---------- init ---------- */
(async () => {
  render();
  await Store.open();
  try { if (navigator.storage && navigator.storage.persist) S.persistent = await navigator.storage.persist(); } catch (e) {}
  S.ready = true;
  await reload();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
